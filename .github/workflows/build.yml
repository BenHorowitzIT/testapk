name: Build APK

on:
  push:
  workflow_dispatch:

env:
  # Sandbox engine: NewBlackbox (Apache-2.0), pinned to a tested commit
  ENGINE_REPO: https://github.com/ALEX5402/NewBlackbox.git
  ENGINE_COMMIT: 89b59836c66f173756a4ae258cf379a957649820

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install SDK packages (platform 35, NDK for the engine)
        run: |
          # GitHub's Ubuntu machines come with the Android SDK preinstalled
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager"
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-35" "build-tools;35.0.0"
          "$SDKM" --install "ndk;29.0.13846066" || echo "NDK install failed here; Gradle will try to fetch it."
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Download sandbox engine
        run: |
          mkdir -p engine/NewBlackbox
          cd engine/NewBlackbox
          git init -q
          git remote add origin "$ENGINE_REPO"
          git fetch -q --depth 1 origin "$ENGINE_COMMIT"
          git checkout -q FETCH_HEAD
          echo "Engine at $(git rev-parse HEAD)"

      - name: Apply VelvetBox engine patches
        run: python3 engine-patches/apply_patches.py engine/NewBlackbox

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: VelvetBox-apk
          path: app/build/outputs/apk/release/*.apk

      # Test build of the engine's own demo app, to check whether the engine
      # itself works on the phone. Failing here never blocks VelvetBox.
      - name: Build engine demo app (test only)
        continue-on-error: true
        run: |
          cd engine/NewBlackbox
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload engine demo app
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v5
        with:
          name: Engine-demo-apk
          path: engine/NewBlackbox/app/build/outputs/apk/debug/*universal*.apk
          if-no-files-found: warn

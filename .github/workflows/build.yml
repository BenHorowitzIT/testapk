name: Build APK

on:
  push:
  workflow_dispatch:

env:
  # Sandbox engine: NewBlackbox (Apache-2.0), pinned to a tested commit
  ENGINE_REPO: https://github.com/ALEX5402/NewBlackbox.git
  ENGINE_COMMIT: 89b59836c66f173756a4ae258cf379a957649820
  # Split-APK merger: ARSCLib jar shipped with APKEditor (Apache-2.0)
  APKEDITOR_TAG: V1.4.9

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (platform 35, NDK for the engine)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --install "ndk;29.0.13846066" || echo "NDK install failed here; Gradle will try to fetch it."

      - name: Download sandbox engine
        run: |
          mkdir -p engine/NewBlackbox
          cd engine/NewBlackbox
          git init -q
          git remote add origin "$ENGINE_REPO"
          git fetch -q --depth 1 origin "$ENGINE_COMMIT"
          git checkout -q FETCH_HEAD
          # Shrinking the engine breaks its reflection tricks, so turn it off.
          sed -i 's/minifyEnabled true/minifyEnabled false/' Bcore/build.gradle
          echo "Engine at $(git rev-parse HEAD)"

      - name: Download split-APK merger
        run: |
          git clone -q --depth 1 --branch "$APKEDITOR_TAG" https://github.com/REAndroid/APKEditor.git "$RUNNER_TEMP/apkeditor"
          mkdir -p app/libs
          cp "$RUNNER_TEMP/apkeditor/libs/ARSCLib.jar" app/libs/ARSCLib.jar
          # Drop the stub copies of Android framework classes; the phone already has them.
          zip -q -d app/libs/ARSCLib.jar 'android/*' 'org/xmlpull/*' || true
          ls -la app/libs

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VelvetBox-apk
          path: app/build/outputs/apk/release/*.apk
